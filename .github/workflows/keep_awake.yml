name: Keep PIVOK Bots Warm (Store Hours)

on:
  schedule:
    # Runs every 10 minutes from 06:00 to 17:50 UTC (09:00 to 20:50 Istanbul time)
    # Stays safely within Render Free's 750h/month allowance across both bots
    - cron: '*/10 6-17 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PIVOK Studio & Post Bot health endpoints
        run: |
          curl -fsS -m 45 "https://pivok-studio.onrender.com/health" || true
          echo ""
          curl -fsS -m 45 "https://pivok-post-bot.onrender.com/health" || true
