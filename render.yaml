services:
  - type: web
    name: pivok-post-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: BOT_SECRET_PASSWORD
        value: pivok
      - key: ALLOWED_USER_IDS
        value: "7042397101"
      - key: PIVOK_CHANNEL
        value: "@pivoklaleli"
