<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIVOK Post Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #1a1620);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overscroll-behavior-y: none;
        }
        .btn-pivok {
            background-color: #5d0537;
            color: #f5d8b8;
            border: 1px solid #8a1d5a;
        }
        .text-hint { color: var(--tg-theme-hint-color, #9ca3af); }

        .tab-active {
            border-bottom: 2px solid #d6a474;
            color: #d6a474;
            font-weight: bold;
        }
        .tab-inactive { color: var(--tg-theme-hint-color, #9ca3af); }

        /* Drag & Drop styles */
        .sortable-ghost { opacity: 0.4; background-color: rgba(214, 164, 116, 0.2); }
        .sortable-drag { cursor: grabbing !important; }
        .handle { cursor: grab; }

        /* Telegram Button Colors (Bot API 9.4+) */
        .tg-bg-default { background-color: #2b3a4a; color: #ffffff; }
        .tg-bg-primary { background-color: #2d7696; color: #ffffff; }
        .tg-bg-success { background-color: #3f7d3b; color: #ffffff; }
        .tg-bg-danger  { background-color: #9e473d; color: #ffffff; }

        input, select, textarea {
            background-color: var(--tg-theme-secondary-bg-color, #2d2635);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid #4b3f57;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #d6a474;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Tabs -->
    <div class="flex border-b border-gray-700 bg-[var(--tg-theme-bg-color)] z-10 shrink-0">
        <button id="tab-editor" onclick="switchTab('editor')" class="flex-1 py-3 text-center tab-active transition text-sm">
            Editor
        </button>
        <button id="tab-text" onclick="switchTab('text')" class="flex-1 py-3 text-center tab-inactive transition text-sm">
            Post Text
        </button>
        <button id="tab-preview" onclick="switchTab('preview')" class="flex-1 py-3 text-center tab-inactive transition text-sm">
            Preview
        </button>
    </div>

    <!-- Main Scroll Container -->
    <div class="flex-1 overflow-y-auto p-4 pb-24" id="main-scroll">

        <!-- TAB: ROW & BUTTON EDITOR (solastore2026 mechanism in PIVOK colors) -->
        <div id="view-editor" class="block space-y-4">
            <div class="flex justify-between items-center mb-2">
                <p class="text-sm text-hint">Hold <span class="text-lg">≡</span> to drag and reorder.</p>
            </div>

            <div id="rows-container" class="space-y-6"></div>

            <button type="button" onclick="addNewRow()" class="w-full py-3 border-2 border-dashed border-gray-500 rounded-lg text-gray-400 hover:text-white hover:border-[#d6a474] transition flex items-center justify-center gap-2 mt-6">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Add new row
            </button>
        </div>

        <!-- TAB: POST TEXT -->
        <div id="view-text" class="hidden space-y-2.5">
            <div class="flex items-center justify-between">
                <p class="text-sm text-hint" id="text-mode-label">Edit post text:</p>
                <span id="char-counter" class="text-xs font-mono text-gray-400">0 / 4096</span>
            </div>
            <textarea id="post-text-area" rows="14" oninput="updateCharCounter()" placeholder="Enter post text or photo caption..." class="w-full text-sm rounded-xl p-3 leading-relaxed"></textarea>
        </div>

        <!-- TAB: PREVIEW -->
        <div id="view-preview" class="hidden">
            <p class="text-sm text-hint mb-4 text-center">How your post and buttons will look in Telegram:</p>
            <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-700 max-w-sm mx-auto shadow-lg">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold" style="color:#d6a474;">PIVOK</span>
                    <span id="preview-media-badge" class="hidden text-[11px] px-2 py-0.5 rounded bg-[#5d0537] text-[#f5d8b8]">📷 Photo / Media</span>
                </div>
                <div id="preview-text-box" class="text-xs text-gray-200 whitespace-pre-wrap mb-3 leading-relaxed max-h-56 overflow-y-auto"></div>
                <div id="preview-placeholder" class="flex gap-3 mb-4 opacity-50 hidden">
                    <div class="w-10 h-10 rounded-full shrink-0" style="background:#5d0537;"></div>
                    <div class="flex-1">
                        <div class="h-3 w-24 bg-gray-500 rounded mb-2"></div>
                        <div class="h-3 w-full bg-gray-600 rounded mb-1"></div>
                        <div class="h-3 w-2/3 bg-gray-600 rounded"></div>
                    </div>
                </div>
                <div id="preview-container" class="space-y-1.5"></div>
            </div>
        </div>

    </div>

    <!-- Fixed Bottom Bar -->
    <div class="fixed bottom-0 left-0 w-full p-4 bg-gradient-to-t from-[var(--tg-theme-bg-color)] via-[var(--tg-theme-bg-color)] to-transparent shrink-0">
        <button id="save-btn" type="button" onclick="saveAndClose()" class="w-full btn-pivok py-3.5 rounded-xl font-bold shadow-lg text-lg flex justify-center items-center gap-2">
            SAVE AND CLOSE
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        try { tg.enableClosingConfirmation(); } catch (e) {}

        const urlParams = new URLSearchParams(window.location.search);
        const uidParam = urlParams.get('uid') || '';
        const cidParam = urlParams.get('cid') || '';
        const pmIdParam = urlParams.get('pmid') || '';

        let rows = [];
        let mediaType = null;
        let currentTab = 'editor';
        let sortableRowsInstance = null;
        let sortableButtonsInstances = [];

        function normalizeUrl(u) {
            let s = (u || '').trim();
            if (!s) return '';
            if (s.startsWith('@')) return 'https://t.me/' + s.slice(1);
            if (!/^https?:\/\//i.test(s) && !/^tg:\/\//i.test(s)) return 'https://' + s;
            return s;
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function getMaxChars() {
            return mediaType ? 1024 : 4096;
        }

        function updateCharCounter() {
            const val = document.getElementById('post-text-area').value || '';
            const max = getMaxChars();
            const el = document.getElementById('char-counter');
            el.innerText = `${val.length} / ${max}`;
            el.className = val.length > max
                ? 'text-xs font-mono text-red-400 font-bold'
                : 'text-xs font-mono text-gray-400';
        }

        fetch('/api/get_draft', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                initData: tg.initData,
                uid: uidParam,
                cid: cidParam,
                pmid: pmIdParam
            })
        })
        .then(r => r.json())
        .then(data => {
            if (Array.isArray(data.rows) && data.rows.length > 0) {
                rows = data.rows;
            } else {
                rows = [[{ text: '', url: '', style: '' }]];
            }
            mediaType = data.media_type || null;
            if (mediaType) {
                document.getElementById('text-mode-label').innerText = `Edit ${mediaType} caption (optional):`;
                document.getElementById('preview-media-badge').classList.remove('hidden');
            }
            if (typeof data.text === 'string') {
                document.getElementById('post-text-area').value = data.text;
            }
            updateCharCounter();
            renderEditor();
        })
        .catch(() => {
            rows = [[{ text: '', url: '', style: '' }]];
            renderEditor();
        });

        function switchTab(tab) {
            if (currentTab === 'editor') {
                saveInputsToData();
            }
            currentTab = tab;

            const tabs = {
                editor: ['tab-editor', 'view-editor'],
                text: ['tab-text', 'view-text'],
                preview: ['tab-preview', 'view-preview']
            };

            Object.keys(tabs).forEach(k => {
                const [btnId, viewId] = tabs[k];
                document.getElementById(btnId).className = `flex-1 py-3 text-center transition text-sm ${k === tab ? 'tab-active' : 'tab-inactive'}`;
                document.getElementById(viewId).classList.toggle('hidden', k !== tab);
            });

            if (tab === 'editor') {
                renderEditor();
            } else if (tab === 'preview') {
                sortFirms();
                renderPreview();
            }
        }

        function saveInputsToData() {
            const container = document.getElementById('rows-container');
            const rowEls = container.querySelectorAll('.row-block');
            if (rowEls.length === 0 && rows.length > 0 && currentTab !== 'editor') return;

            let newRows = [];
            rowEls.forEach(rowEl => {
                let r = [];
                rowEl.querySelectorAll('.btn-block').forEach(btnEl => {
                    const text = btnEl.querySelector('.input-text').value;
                    const url = btnEl.querySelector('.input-url').value;
                    const style = btnEl.querySelector('.select-style').value;
                    r.push({ text, url, style: style || null });
                });
                newRows.push(r);
            });
            rows = newRows;
        }

        function renderEditor() {
            const container = document.getElementById('rows-container');
            container.innerHTML = '';

            sortableButtonsInstances.forEach(s => s.destroy());
            sortableButtonsInstances = [];
            if (sortableRowsInstance) sortableRowsInstance.destroy();

            rows.forEach((row, rIndex) => {
                const rowEl = document.createElement('div');
                rowEl.className = 'row-block bg-gray-800/70 border border-gray-700 rounded-xl overflow-hidden shadow-sm';
                rowEl.dataset.rindex = rIndex;

                const header = document.createElement('div');
                header.className = 'bg-gray-900/50 p-2 flex justify-between items-center border-b border-gray-700';
                header.innerHTML = `
                    <div class="flex items-center gap-2">
                        <div class="row-handle text-gray-500 hover:text-white px-2 py-1 cursor-grab">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>
                        </div>
                        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">ROW ${rIndex + 1}</span>
                    </div>
                    <button type="button" onclick="deleteRow(${rIndex})" class="text-red-400 hover:text-red-300 px-2 py-1 text-sm font-medium">Delete row</button>
                `;
                rowEl.appendChild(header);

                const btnsContainer = document.createElement('div');
                btnsContainer.className = 'btns-container p-2 space-y-2';
                btnsContainer.dataset.rindex = rIndex;

                row.forEach((btn, bIndex) => {
                    const btnEl = document.createElement('div');
                    btnEl.className = 'btn-block flex gap-3 bg-gray-700/50 p-3 rounded-lg border border-gray-600 relative';

                    btnEl.innerHTML = `
                        <div class="btn-handle flex items-center justify-center text-gray-500 cursor-grab hover:text-white shrink-0">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                        </div>

                        <div class="flex-1 space-y-2 min-w-0">
                            <input type="text" class="input-text w-full text-sm rounded px-2 py-1.5 transition placeholder-gray-500" placeholder="Button title" value="${escapeHtml(btn.text)}">
                            <div class="flex gap-2">
                                <input type="url" class="input-url w-full text-sm rounded px-2 py-1.5 transition placeholder-gray-500" placeholder="https://" value="${escapeHtml(btn.url)}">
                                <select class="select-style w-28 text-sm rounded px-1 py-1.5 transition shrink-0">
                                    <option value="" ${!btn.style ? 'selected' : ''}>Dark</option>
                                    <option value="primary" ${btn.style === 'primary' ? 'selected' : ''}>Blue</option>
                                    <option value="success" ${btn.style === 'success' ? 'selected' : ''}>Green</option>
                                    <option value="danger" ${btn.style === 'danger' ? 'selected' : ''}>Red</option>
                                </select>
                            </div>
                        </div>

                        <button type="button" onclick="deleteButton(${rIndex}, ${bIndex})" class="shrink-0 text-gray-400 hover:text-red-400 p-1 flex items-start self-start">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    `;
                    btnsContainer.appendChild(btnEl);
                });

                rowEl.appendChild(btnsContainer);

                const addBtnContainer = document.createElement('div');
                addBtnContainer.className = 'p-2 pt-0';
                addBtnContainer.innerHTML = `
                    <button type="button" onclick="addNewButton(${rIndex})" class="w-full py-2 bg-gray-700/50 hover:bg-gray-600/50 text-gray-300 rounded border border-gray-600 transition text-sm flex items-center justify-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                        Add button to row
                    </button>
                `;
                rowEl.appendChild(addBtnContainer);
                container.appendChild(rowEl);

                sortableButtonsInstances.push(
                    new Sortable(btnsContainer, {
                        group: 'buttons',
                        handle: '.btn-handle',
                        animation: 150,
                        ghostClass: 'sortable-ghost',
                        onEnd: function () {
                            saveInputsToData();
                            renderEditor();
                        }
                    })
                );
            });

            sortableRowsInstance = new Sortable(container, {
                handle: '.row-handle',
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: function () {
                    saveInputsToData();
                    renderEditor();
                }
            });
        }

        function renderPreview() {
            const txt = document.getElementById('post-text-area').value || '';
            const textBox = document.getElementById('preview-text-box');
            const placeholder = document.getElementById('preview-placeholder');
            if (txt.trim()) {
                textBox.innerText = txt;
                textBox.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                textBox.classList.add('hidden');
                placeholder.classList.toggle('hidden', Boolean(mediaType));
            }

            const container = document.getElementById('preview-container');
            container.innerHTML = '';

            const validRows = rows
                .map(r => r.filter(b => (b.text || '').trim() !== ''))
                .filter(r => r.length > 0);

            if (validRows.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-2 text-sm italic">No buttons added</p>';
                return;
            }

            validRows.forEach(row => {
                const rowEl = document.createElement('div');
                rowEl.className = 'flex gap-1.5 w-full';

                row.forEach(btn => {
                    const btnEl = document.createElement('div');
                    let bgClass = 'tg-bg-default';
                    if (btn.style === 'primary') bgClass = 'tg-bg-primary';
                    if (btn.style === 'success') bgClass = 'tg-bg-success';
                    if (btn.style === 'danger') bgClass = 'tg-bg-danger';

                    btnEl.className = `flex-1 flex justify-center items-center px-2 py-2 rounded-lg text-sm font-medium ${bgClass} truncate overflow-hidden whitespace-nowrap shadow-sm`;
                    btnEl.innerHTML = `<span class="truncate block w-full text-center">${escapeHtml(btn.text)} <span class="opacity-50 text-[10px] ml-1">↗</span></span>`;

                    rowEl.appendChild(btnEl);
                });
                container.appendChild(rowEl);
            });
        }

        function addNewRow() {
            saveInputsToData();
            rows.push([{ text: '', url: '', style: '' }]);
            renderEditor();
            setTimeout(() => {
                const container = document.getElementById('main-scroll');
                container.scrollTop = container.scrollHeight;
            }, 50);
        }

        function addNewButton(rowIndex) {
            saveInputsToData();
            rows[rowIndex].push({ text: '', url: '', style: '' });
            renderEditor();
        }

        function deleteRow(rowIndex) {
            if (confirm('Delete this entire row?')) {
                saveInputsToData();
                rows.splice(rowIndex, 1);
                renderEditor();
            }
        }

        function repackRowsInPairs() {
            const result = [];
            let buffer = [];
            for (let i = 0; i < rows.length; i++) {
                if (rows[i].length > 2) {
                    while (buffer.length > 0) {
                        result.push(buffer.splice(0, 2));
                    }
                    result.push(rows[i]);
                } else {
                    buffer.push(...rows[i]);
                }
            }
            while (buffer.length > 0) {
                result.push(buffer.splice(0, 2));
            }
            rows = result;
        }

        function deleteButton(rowIndex, btnIndex) {
            saveInputsToData();
            rows[rowIndex].splice(btnIndex, 1);
            repackRowsInPairs();
            renderEditor();
        }

        // Keep top PIVOK utility rows intact; sort extra brand rows below them A-Z in pairs
        function sortFirms() {
            const coreMarkers = ['WHATSAPP', 'INSTAGRAM', 'SALE CHANNEL', 'VIDEO CHANNEL', 'ADDRESS', 'LOCATION', 'TELEGRAM'];
            let lastCoreRowIndex = -1;
            for (let i = 0; i < rows.length; i++) {
                const isCore = rows[i].some(b => {
                    const up = (b.text || '').toUpperCase();
                    return coreMarkers.some(m => up.includes(m));
                });
                if (isCore) {
                    lastCoreRowIndex = i;
                }
            }

            if (lastCoreRowIndex === -1 || lastCoreRowIndex >= rows.length - 1) {
                return;
            }

            const topRows = rows.slice(0, lastCoreRowIndex + 1);
            const firmRows = rows.slice(lastCoreRowIndex + 1);

            let firmButtons = [];
            firmRows.forEach(r => {
                firmButtons.push(...r.filter(b => (b.text || '').trim() !== ''));
            });
            if (firmButtons.length === 0) return;

            const cleanForSort = (text) =>
                text.replace(/🆕/g, '')
                    .replace(/\bnew\b/ig, '')
                    .replace(/[^\p{L}\p{N}\s]/gu, '')
                    .trim()
                    .toLowerCase();

            firmButtons.sort((a, b) => cleanForSort(a.text).localeCompare(cleanForSort(b.text)));

            const newFirmRows = [];
            for (let i = 0; i < firmButtons.length; i += 2) {
                newFirmRows.push(firmButtons.slice(i, i + 2));
            }
            rows = [...topRows, ...newFirmRows];
        }

        function saveAndClose() {
            if (currentTab === 'editor') {
                saveInputsToData();
            }
            sortFirms();

            let hasInvalidUrl = false;
            const normalizedRows = rows.map(r =>
                r.map(b => ({
                    text: (b.text || '').trim(),
                    url: normalizeUrl(b.url || ''),
                    style: b.style || null
                }))
            );

            normalizedRows.forEach(r => {
                r.forEach(b => {
                    if (b.text !== '' && b.url === '') {
                        hasInvalidUrl = true;
                    }
                });
            });

            if (hasInvalidUrl) {
                switchTab('editor');
                tg.showAlert('One or more buttons have a title without a URL. Please enter a valid https:// link or remove the button.');
                return;
            }

            const postText = document.getElementById('post-text-area').value || '';
            const maxChars = getMaxChars();
            if (postText.length > maxChars) {
                switchTab('text');
                tg.showAlert(`Text exceeds maximum length (${postText.length} / ${maxChars} characters).`);
                return;
            }
            if (!mediaType && !postText.trim()) {
                switchTab('text');
                tg.showAlert('Post text cannot be empty.');
                return;
            }

            const cleanRows = normalizedRows
                .map(r => r.filter(b => b.text !== '' && b.url !== ''))
                .filter(r => r.length > 0);

            document.getElementById('save-btn').disabled = true;
            document.getElementById('save-btn').innerText = 'SAVING...';

            fetch('/api/save_draft', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    initData: tg.initData,
                    uid: uidParam,
                    cid: cidParam,
                    pmid: pmIdParam,
                    rows: cleanRows,
                    text: postText
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    tg.close();
                } else {
                    tg.showAlert('Error saving changes: ' + (data.error || 'Unknown error'));
                    document.getElementById('save-btn').disabled = false;
                    document.getElementById('save-btn').innerText = 'SAVE AND CLOSE';
                }
            })
            .catch(() => {
                tg.showAlert('Network error while saving.');
                document.getElementById('save-btn').disabled = false;
                document.getElementById('save-btn').innerText = 'SAVE AND CLOSE';
            });
        }
    </script>
</body>
</html>
