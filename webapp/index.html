<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PÎVOK — Post & Button Constructor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #1a1620);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overscroll-behavior-y: none;
        }
        .btn-pivok { background-color: #5d0537; color: #f5d8b8; border: 1px solid #8a1d5a; }
        .text-hint { color: var(--tg-theme-hint-color, #9ca3af); }
        .tab-active { border-bottom: 2px solid #d6a474; color: #d6a474; font-weight: bold; }
        .tab-inactive { color: var(--tg-theme-hint-color, #9ca3af); }

        .sortable-ghost { opacity: 0.4; background-color: rgba(214, 164, 116, 0.2); }
        .sortable-drag { cursor: grabbing !important; }

        /* Telegram Inline Button Colors (Bot API 9.4+) */
        .tg-bg-default { background-color: #2b3a4a; color: #ffffff; }
        .tg-bg-primary { background-color: #2d7696; color: #ffffff; }
        .tg-bg-success { background-color: #3f7d3b; color: #ffffff; }
        .tg-bg-danger  { background-color: #9e473d; color: #ffffff; }

        input, select, textarea {
            background-color: var(--tg-theme-secondary-bg-color, #2d2635);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid #4b3f57;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Header -->
    <div class="px-4 py-2.5 text-center font-bold text-sm tracking-wide shrink-0" style="background:#5d0537; color:#d6a474;">
        PÎVOK — <span id="hdr-title"></span>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-gray-700 bg-[var(--tg-theme-bg-color)] z-10 shrink-0">
        <button id="tab-editor" onclick="switchTab('editor')" class="flex-1 py-3 text-center tab-active transition text-xs sm:text-sm"></button>
        <button id="tab-text" onclick="switchTab('text')" class="flex-1 py-3 text-center tab-inactive transition text-xs sm:text-sm"></button>
        <button id="tab-preview" onclick="switchTab('preview')" class="flex-1 py-3 text-center tab-inactive transition text-xs sm:text-sm"></button>
    </div>

    <!-- Main Scroll Area -->
    <div class="flex-1 overflow-y-auto p-4 pb-28" id="main-scroll">

        <!-- BUTTONS TAB -->
        <div id="view-editor" class="block space-y-4">
            <div class="flex flex-wrap justify-between items-center gap-2 mb-2">
                <p class="text-xs text-hint" id="lbl-drag-hint"></p>
                <label class="flex items-center gap-1.5 text-xs text-gray-300 cursor-pointer select-none bg-gray-800/70 px-2.5 py-1.5 rounded-lg border border-gray-700">
                    <input type="checkbox" id="chk-autosort" checked class="rounded">
                    <span id="lbl-autosort"></span>
                </label>
            </div>

            <div id="rows-container" class="space-y-5"></div>

            <button onclick="addNewRow()" class="w-full py-3 border-2 border-dashed border-gray-500 rounded-lg text-gray-300 hover:text-white hover:border-gray-400 transition flex items-center justify-center gap-2 mt-4 text-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span id="lbl-add-row"></span>
            </button>
        </div>

        <!-- TEXT TAB -->
        <div id="view-text" class="hidden space-y-3">
            <p class="text-xs text-hint" id="lbl-text-hint"></p>
            <textarea id="post-text-area" rows="16" class="w-full text-sm rounded-xl p-3 leading-relaxed focus:outline-none focus:border-pink-500"></textarea>
        </div>

        <!-- PREVIEW TAB -->
        <div id="view-preview" class="hidden">
            <p class="text-xs text-hint mb-3 text-center" id="lbl-preview-hint"></p>
            <div class="bg-gray-800/60 p-3.5 rounded-xl border border-gray-700 max-w-md mx-auto shadow-lg">
                <div class="text-xs font-bold mb-1.5" style="color:#e879a0;">PÎVOK</div>
                <div id="preview-text-box" class="text-xs text-gray-200 whitespace-pre-wrap mb-3 leading-relaxed max-h-56 overflow-y-auto"></div>
                <div id="preview-container" class="space-y-1.5"></div>
            </div>
        </div>

    </div>

    <!-- Fixed Save Footer -->
    <div class="fixed bottom-0 left-0 w-full p-3.5 bg-gradient-to-t from-[var(--tg-theme-bg-color)] via-[var(--tg-theme-bg-color)] to-transparent shrink-0">
        <button id="save-btn" onclick="saveAndClose()" class="w-full btn-pivok py-3.5 rounded-xl font-bold shadow-lg text-base flex justify-center items-center gap-2">
            <span id="lbl-save"></span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        try { tg.enableClosingConfirmation(); } catch (e) {}

        const urlParams = new URLSearchParams(window.location.search);
        const lang = (urlParams.get('lang') || 'ru').toLowerCase() === 'tr' ? 'tr' : 'ru';
        const uidParam = urlParams.get('uid') || '';
        const cidParam = urlParams.get('cid') || '';
        const pmIdParam = urlParams.get('pmid') || '';

        const T = {
            ru: {
                hdr: "Конструктор закрепки",
                tabEdit: "🔘 Кнопки",
                tabText: "📝 Текст поста",
                tabPrev: "👁 Превью",
                dragHint: "Удерживайте ≡ для перемещения • Кнопка 🆕 включает зелёный NEW",
                autoSort: "Сортировать А–Я после INSTAGRAM",
                addRow: "Добавить новый ряд",
                textHint: "Текст поста (при редактировании текста все ваши кнопки сохраняются):",
                prevHint: "Так пост и кнопки будут выглядеть в канале @pivoklaleli:",
                saveBtn: "СОХРАНИТЬ ИЗМЕНЕНИЯ",
                saving: "Сохранение...",
                rowTitle: (i) => `Ряд ${i}`,
                delRow: "Удалить ряд",
                confirmDelRow: "Удалить весь ряд?",
                addBtnInRow: "Добавить кнопку в ряд",
                phText: "Название кнопки (напр. MY CLARISSA)",
                phUrl: "https://t.me/... или https://wa.me/...",
                stDefault: "Тёмный",
                stPrimary: "Синий",
                stSuccess: "Зелёный",
                stDanger: "Красный",
                noBtns: "Кнопок пока нет",
                errUrl: "У некоторых кнопок указано название, но не указана ссылка! Заполните ссылку для каждой кнопки.",
                errSave: "Ошибка сохранения: ",
                errNet: "Сетевая ошибка при сохранении"
            },
            tr: {
                hdr: "Sabit Post Tasarımcısı",
                tabEdit: "🔘 Butonlar",
                tabText: "📝 Post Metni",
                tabPrev: "👁 Önizleme",
                dragHint: "Taşımak için ≡ basılı tutun • 🆕 tuşu yeşil NEW modunu açar",
                autoSort: "INSTAGRAM sonrası A–Z sırala",
                addRow: "Yeni Satır Ekle",
                textHint: "Post metni (metni değiştirdiğinizde tüm butonlarınız korunur):",
                prevHint: "@pivoklaleli kanalında post böyle görünecek:",
                saveBtn: "DEĞİŞİKLİKLERİ KAYDET",
                saving: "Kaydediliyor...",
                rowTitle: (i) => `Satır ${i}`,
                delRow: "Satırı Sil",
                confirmDelRow: "Tüm satır silinsin mi?",
                addBtnInRow: "Satıra Buton Ekle",
                phText: "Buton adı (örn. MY CLARISSA)",
                phUrl: "https://t.me/... veya https://wa.me/...",
                stDefault: "Koyu",
                stPrimary: "Mavi",
                stSuccess: "Yeşil",
                stDanger: "Kırmızı",
                noBtns: "Henüz buton yok",
                errUrl: "Bazı butonların adı var ancak linki boş! Lütfen her buton için link girin.",
                errSave: "Kaydetme hatası: ",
                errNet: "Kaydederken ağ hatası oluştu"
            }
        }[lang];

        document.getElementById('hdr-title').innerText = T.hdr;
        document.getElementById('tab-editor').innerText = T.tabEdit;
        document.getElementById('tab-text').innerText = T.tabText;
        document.getElementById('tab-preview').innerText = T.tabPrev;
        document.getElementById('lbl-drag-hint').innerText = T.dragHint;
        document.getElementById('lbl-autosort').innerText = T.autoSort;
        document.getElementById('lbl-add-row').innerText = T.addRow;
        document.getElementById('lbl-text-hint').innerText = T.textHint;
        document.getElementById('lbl-preview-hint').innerText = T.prevHint;
        document.getElementById('lbl-save').innerText = T.saveBtn;

        let rows = [];
        let hasMediaPost = false;
        let currentTab = 'editor';
        let sortableRowsInstance = null;
        let sortableButtonsInstances = [];

        fetch('/api/get_draft', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                initData: tg.initData,
                uid: uidParam,
                cid: cidParam,
                pmid: pmIdParam
            })
        })
        .then(r => r.json())
        .then(data => {
            if (data.rows && data.rows.length > 0) {
                rows = data.rows;
            } else {
                rows = [[{ text: '', url: '', style: '' }]];
            }
            if (typeof data.text === 'string') {
                document.getElementById('post-text-area').value = data.text;
            }
            hasMediaPost = !!data.is_media;
            if (hasMediaPost) {
                document.getElementById('tab-text').classList.add('hidden');
            }
            if (typeof data.auto_sort === 'boolean') {
                document.getElementById('chk-autosort').checked = data.auto_sort;
            }
            renderEditor();
        })
        .catch(() => {
            rows = [[{ text: '', url: '', style: '' }]];
            renderEditor();
        });

        function normalizeUrl(u) {
            let s = (u || '').trim();
            if (!s) return '';
            if (s.startsWith('@')) {
                return 'https://t.me/' + s.slice(1);
            }
            if (!/^https?:\/\//i.test(s) && !/^tg:\/\//i.test(s)) {
                return 'https://' + s;
            }
            return s;
        }

        function switchTab(tab) {
            if (currentTab === 'editor') saveInputsToData();
            currentTab = tab;

            const tabs = {
                editor: [document.getElementById('tab-editor'), document.getElementById('view-editor')],
                text: [document.getElementById('tab-text'), document.getElementById('view-text')],
                preview: [document.getElementById('tab-preview'), document.getElementById('view-preview')]
            };

            Object.keys(tabs).forEach(k => {
                const [btn, view] = tabs[k];
                if (k === tab) {
                    btn.className = "flex-1 py-3 text-center tab-active transition text-xs sm:text-sm" + (k === 'text' && hasMediaPost ? " hidden" : "");
                    view.classList.remove('hidden');
                } else {
                    btn.className = "flex-1 py-3 text-center tab-inactive transition text-xs sm:text-sm" + (k === 'text' && hasMediaPost ? " hidden" : "");
                    view.classList.add('hidden');
                }
            });

            if (tab === 'editor') {
                renderEditor();
            } else if (tab === 'preview') {
                if (document.getElementById('chk-autosort').checked) sortFirms();
                renderPreview();
            }
        }

        function saveInputsToData() {
            const container = document.getElementById('rows-container');
            const rowEls = container.querySelectorAll('.row-block');
            if (rowEls.length === 0 && rows.length > 0) return;

            let newRows = [];
            rowEls.forEach((rowEl) => {
                let r = [];
                rowEl.querySelectorAll('.btn-block').forEach((btnEl) => {
                    const text = btnEl.querySelector('.input-text').value;
                    const url = normalizeUrl(btnEl.querySelector('.input-url').value);
                    const style = btnEl.querySelector('.select-style').value;
                    r.push({ text, url, style: style || null });
                });
                newRows.push(r);
            });
            rows = newRows;
        }

        function toggleNewBadge(rIndex, bIndex) {
            saveInputsToData();
            const btn = rows[rIndex][bIndex];
            if (!btn) return;
            const hasNew = btn.text.includes('🆕');
            if (hasNew) {
                btn.text = btn.text.replace(/🆕\s*/g, '').trim();
                if (btn.style === 'success') btn.style = null;
            } else {
                btn.text = '🆕 ' + btn.text.trim();
                btn.style = 'success';
            }
            renderEditor();
        }

        function renderEditor() {
            const container = document.getElementById('rows-container');
            container.innerHTML = '';

            sortableButtonsInstances.forEach(s => s.destroy());
            sortableButtonsInstances = [];
            if (sortableRowsInstance) sortableRowsInstance.destroy();

            rows.forEach((row, rIndex) => {
                const rowEl = document.createElement('div');
                rowEl.className = 'row-block bg-gray-800/70 border border-gray-700 rounded-xl overflow-hidden shadow-sm';

                const header = document.createElement('div');
                header.className = 'bg-gray-900/60 p-2 flex justify-between items-center border-b border-gray-700';
                header.innerHTML = `
                    <div class="flex items-center gap-2">
                        <div class="row-handle text-gray-400 hover:text-white px-2 py-1 cursor-grab">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>
                        </div>
                        <span class="text-xs font-semibold text-gray-300 uppercase tracking-wider">${T.rowTitle(rIndex + 1)}</span>
                    </div>
                    <button onclick="deleteRow(${rIndex})" class="text-red-400 hover:text-red-300 px-2 py-1 text-xs font-medium">${T.delRow}</button>
                `;
                rowEl.appendChild(header);

                const btnsContainer = document.createElement('div');
                btnsContainer.className = 'btns-container p-2 space-y-2';

                row.forEach((btn, bIndex) => {
                    const isNewActive = (btn.text || '').includes('🆕');
                    const btnEl = document.createElement('div');
                    btnEl.className = 'btn-block flex gap-2 bg-gray-700/40 p-2.5 rounded-lg border border-gray-600 relative';
                    btnEl.innerHTML = `
                        <div class="btn-handle flex items-center justify-center text-gray-400 cursor-grab hover:text-white shrink-0">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                        </div>
                        <div class="flex-1 space-y-2 min-w-0">
                            <div class="flex gap-1.5">
                                <input type="text" class="input-text w-full text-sm rounded px-2.5 py-1.5 placeholder-gray-500" placeholder="${escapeHtml(T.phText)}" value="${escapeHtml(btn.text)}">
                                <button type="button" onclick="toggleNewBadge(${rIndex}, ${bIndex})" title="NEW" class="px-2 py-1 rounded text-xs font-bold shrink-0 border ${isNewActive ? 'bg-green-700 border-green-400 text-white' : 'bg-gray-800 border-gray-600 text-gray-400'}">🆕</button>
                            </div>
                            <div class="flex gap-2">
                                <input type="text" class="input-url w-full text-sm rounded px-2.5 py-1.5 placeholder-gray-500" placeholder="${escapeHtml(T.phUrl)}" value="${escapeHtml(btn.url)}">
                                <select class="select-style w-28 text-xs rounded px-1.5 py-1.5 shrink-0">
                                    <option value="" ${!btn.style ? 'selected' : ''}>⬛ ${T.stDefault}</option>
                                    <option value="primary" ${btn.style === 'primary' ? 'selected' : ''}>🟦 ${T.stPrimary}</option>
                                    <option value="success" ${btn.style === 'success' ? 'selected' : ''}>🟩 ${T.stSuccess}</option>
                                    <option value="danger" ${btn.style === 'danger' ? 'selected' : ''}>🟥 ${T.stDanger}</option>
                                </select>
                            </div>
                        </div>
                        <button onclick="deleteButton(${rIndex}, ${bIndex})" class="shrink-0 text-gray-400 hover:text-red-400 p-1 flex items-start self-start">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    `;
                    btnsContainer.appendChild(btnEl);
                });

                rowEl.appendChild(btnsContainer);

                const addBtnContainer = document.createElement('div');
                addBtnContainer.className = 'p-2 pt-0';
                addBtnContainer.innerHTML = `
                    <button onclick="addNewButton(${rIndex})" class="w-full py-2 bg-gray-700/40 hover:bg-gray-600/50 text-gray-200 rounded border border-gray-600 transition text-xs flex items-center justify-center gap-1">
                        + ${T.addBtnInRow}
                    </button>
                `;
                rowEl.appendChild(addBtnContainer);
                container.appendChild(rowEl);

                sortableButtonsInstances.push(
                    new Sortable(btnsContainer, {
                        group: 'buttons',
                        handle: '.btn-handle',
                        animation: 150,
                        ghostClass: 'sortable-ghost',
                        onEnd: function () {
                            saveInputsToData();
                            renderEditor();
                        }
                    })
                );
            });

            sortableRowsInstance = new Sortable(container, {
                handle: '.row-handle',
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: function () {
                    saveInputsToData();
                    renderEditor();
                }
            });
        }

        function renderPreview() {
            document.getElementById('preview-text-box').innerText = document.getElementById('post-text-area').value || '';
            const container = document.getElementById('preview-container');
            container.innerHTML = '';
            const validRows = rows.map(r => r.filter(b => b.text.trim() !== '')).filter(r => r.length > 0);
            if (validRows.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 py-2 text-sm italic">${T.noBtns}</p>`;
                return;
            }
            validRows.forEach(row => {
                const rowEl = document.createElement('div');
                rowEl.className = 'flex gap-1.5 w-full';
                row.forEach(btn => {
                    const btnEl = document.createElement('div');
                    let bgClass = 'tg-bg-default';
                    if (btn.style === 'primary') bgClass = 'tg-bg-primary';
                    if (btn.style === 'success') bgClass = 'tg-bg-success';
                    if (btn.style === 'danger') bgClass = 'tg-bg-danger';
                    btnEl.className = `flex-1 flex justify-center items-center px-2 py-2.5 rounded-lg text-xs font-semibold ${bgClass} truncate overflow-hidden whitespace-nowrap shadow-sm relative`;
                    btnEl.innerHTML = `<span class="truncate block w-full text-center pr-3">${escapeHtml(btn.text)}</span><span class="opacity-70 text-[10px] absolute right-1.5 top-1">↗</span>`;
                    rowEl.appendChild(btnEl);
                });
                container.appendChild(rowEl);
            });
        }

        function addNewRow() {
            saveInputsToData();
            rows.push([{ text: '', url: '', style: '' }]);
            renderEditor();
            setTimeout(() => {
                const scrollEl = document.getElementById('main-scroll');
                scrollEl.scrollTop = scrollEl.scrollHeight;
            }, 50);
        }

        function addNewButton(rowIndex) {
            saveInputsToData();
            rows[rowIndex].push({ text: '', url: '', style: '' });
            renderEditor();
        }

        function deleteRow(rowIndex) {
            if (confirm(T.confirmDelRow)) {
                saveInputsToData();
                rows.splice(rowIndex, 1);
                renderEditor();
            }
        }

        function deleteButton(rowIndex, btnIndex) {
            saveInputsToData();
            rows[rowIndex].splice(btnIndex, 1);
            if (rows[rowIndex].length === 0) rows.splice(rowIndex, 1);
            renderEditor();
        }

        function sortFirms() {
            let instagramRowIndex = -1;
            for (let i = 0; i < rows.length; i++) {
                if (rows[i].some(b => b.text.toUpperCase().includes('INSTAGRAM'))) {
                    instagramRowIndex = i;
                    break;
                }
            }
            if (instagramRowIndex === -1) return;

            const topRows = rows.slice(0, instagramRowIndex + 1);
            const firmRows = rows.slice(instagramRowIndex + 1);
            let firmButtons = [];
            firmRows.forEach(r => firmButtons.push(...r.filter(b => b.text.trim() !== '')));
            if (firmButtons.length === 0) return;

            const cleanForSort = (text) =>
                text.replace(/🆕/g, '').replace(/\bnew\b/ig, '').replace(/[^\p{L}\p{N}\s]/gu, '').trim().toLowerCase();

            firmButtons.sort((a, b) => cleanForSort(a.text).localeCompare(cleanForSort(b.text)));

            const newFirmRows = [];
            for (let i = 0; i < firmButtons.length; i += 2) {
                newFirmRows.push(firmButtons.slice(i, i + 2));
            }
            rows = [...topRows, ...newFirmRows];
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function saveAndClose() {
            if (currentTab === 'editor') saveInputsToData();
            const autoSort = document.getElementById('chk-autosort').checked;
            if (autoSort) sortFirms();

            let hasMissingUrl = false;
            rows.forEach(r => r.forEach(b => {
                if (b.text.trim() !== '' && b.url.trim() === '') hasMissingUrl = true;
            }));

            if (hasMissingUrl) {
                tg.showAlert(T.errUrl);
                return;
            }

            const cleanRows = rows
                .map(r => r.filter(b => b.text.trim() !== '' && b.url.trim() !== ''))
                .filter(r => r.length > 0);

            document.getElementById('save-btn').disabled = true;
            document.getElementById('lbl-save').innerText = T.saving;

            const postText = hasMediaPost ? null : document.getElementById('post-text-area').value;

            fetch('/api/save_draft', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    initData: tg.initData,
                    uid: uidParam,
                    cid: cidParam,
                    pmid: pmIdParam,
                    rows: cleanRows,
                    text: postText,
                    auto_sort: autoSort
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    tg.close();
                } else {
                    tg.showAlert(T.errSave + (data.error || ''));
                    document.getElementById('save-btn').disabled = false;
                    document.getElementById('lbl-save').innerText = T.saveBtn;
                }
            })
            .catch(() => {
                tg.showAlert(T.errNet);
                document.getElementById('save-btn').disabled = false;
                document.getElementById('lbl-save').innerText = T.saveBtn;
            });
        }
    </script>
</body>
</html>
