<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIVOK — Post Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #1a1620);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overscroll-behavior-y: none;
        }
        .btn-pivok { background-color: #5d0537; color: #f5d8b8; border: 1px solid #8a1d5a; }
        .text-hint { color: var(--tg-theme-hint-color, #9ca3af); }
        .tab-active { border-bottom: 2px solid #d6a474; color: #d6a474; font-weight: 700; }
        .tab-inactive { color: var(--tg-theme-hint-color, #9ca3af); }

        .sortable-ghost { opacity: 0.4; background-color: rgba(214, 164, 116, 0.2); }
        .sortable-drag { cursor: grabbing !important; }

        .tg-bg-default { background-color: #2b3a4a; color: #ffffff; }
        .tg-bg-primary { background-color: #2d7696; color: #ffffff; }
        .tg-bg-success { background-color: #3f7d3b; color: #ffffff; }
        .tg-bg-danger  { background-color: #9e473d; color: #ffffff; }

        input, select, textarea {
            background-color: var(--tg-theme-secondary-bg-color, #2d2635);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid #4b3f57;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Header -->
    <div class="px-4 py-2.5 flex items-center justify-between text-sm tracking-wide shrink-0" style="background:#5d0537; color:#d6a474;">
        <button onclick="closeWithoutSaving()" class="text-xs px-2.5 py-1 rounded bg-black/25 text-[#f5d8b8] font-semibold">
            ← Back
        </button>
        <div class="font-bold">PIVOK Post Editor</div>
        <div id="channel-badge" class="text-[11px] opacity-85 truncate max-w-[110px]">@pivoklaleli</div>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-gray-700 bg-[var(--tg-theme-bg-color)] z-10 shrink-0">
        <button id="tab-buttons" onclick="switchTab('buttons')" class="flex-1 py-3 text-center tab-active transition text-xs sm:text-sm">
            Buttons
        </button>
        <button id="tab-text" onclick="switchTab('text')" class="flex-1 py-3 text-center tab-inactive transition text-xs sm:text-sm">
            Post Text
        </button>
        <button id="tab-preview" onclick="switchTab('preview')" class="flex-1 py-3 text-center tab-inactive transition text-xs sm:text-sm">
            Preview
        </button>
    </div>

    <!-- Main Scroll Area -->
    <div class="flex-1 overflow-y-auto p-4 pb-28 space-y-4" id="main-scroll">

        <!-- BUTTONS TAB -->
        <div id="view-buttons" class="block space-y-4">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-sm font-bold text-gray-100">PIVOK Post Buttons</h2>
                    <p class="text-xs text-hint">Check the buttons you want attached to this post.</p>
                </div>
                <div class="flex gap-1.5">
                    <button type="button" onclick="selectAllConfigured(true)" class="text-[11px] px-2.5 py-1 rounded bg-gray-800 border border-gray-600 text-gray-200">Select Active</button>
                    <button type="button" onclick="selectAllConfigured(false)" class="text-[11px] px-2.5 py-1 rounded bg-gray-800 border border-gray-600 text-gray-300">Clear</button>
                </div>
            </div>

            <div id="presets-container" class="space-y-2.5"></div>

            <!-- Collapsible Custom Rows (Preserved for extra/brand buttons & /pinned post) -->
            <div class="pt-2 border-t border-gray-700/80">
                <button type="button" onclick="toggleCustomSection()" class="w-full flex items-center justify-between py-2 text-xs font-semibold text-gray-300 hover:text-white">
                    <span id="custom-toggle-label">➕ Custom / Additional Buttons (Optional)</span>
                    <span id="custom-toggle-arrow">▾</span>
                </button>

                <div id="custom-section" class="hidden space-y-3 mt-2">
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-hint">Hold ≡ to reorder custom rows</span>
                        <label class="flex items-center gap-1.5 text-xs text-gray-300 cursor-pointer select-none">
                            <input type="checkbox" id="chk-autosort" class="rounded">
                            <span>Sort A–Z</span>
                        </label>
                    </div>
                    <div id="rows-container" class="space-y-3"></div>
                    <button type="button" onclick="addNewRow()" class="w-full py-2.5 border border-dashed border-gray-500 rounded-lg text-gray-300 hover:text-white text-xs">
                        + Add Custom Button Row
                    </button>
                </div>
            </div>
        </div>

        <!-- POST TEXT TAB -->
        <div id="view-text" class="hidden space-y-2.5">
            <div class="flex items-center justify-between">
                <p class="text-xs text-hint" id="text-mode-label">Edit your post text below:</p>
                <span id="char-counter" class="text-xs font-mono text-gray-400">0 / 4096</span>
            </div>
            <textarea id="post-text-area" rows="14" oninput="updateCharCounter()" placeholder="Write or edit your post text / photo caption..." class="w-full text-sm rounded-xl p-3 leading-relaxed focus:outline-none focus:border-pink-500"></textarea>
        </div>

        <!-- PREVIEW TAB -->
        <div id="view-preview" class="hidden space-y-3">
            <p class="text-xs text-hint text-center">Live preview of how your post will appear in the channel:</p>
            <div class="bg-gray-800/70 p-3.5 rounded-xl border border-gray-700 max-w-md mx-auto shadow-lg">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold" style="color:#e879a0;">PIVOK</span>
                    <span id="preview-media-badge" class="hidden text-[11px] px-2 py-0.5 rounded bg-purple-900/60 border border-purple-700 text-purple-200">📷 Media Attached</span>
                </div>
                <div id="preview-media-box" class="hidden mb-2.5 rounded-lg bg-gray-900/70 border border-gray-700 py-6 text-center text-xs text-gray-400">
                    📷 Attached Photo / Media Preserved
                </div>
                <div id="preview-text-box" class="text-xs text-gray-100 whitespace-pre-wrap mb-3 leading-relaxed max-h-60 overflow-y-auto"></div>
                <div id="preview-container" class="space-y-1.5"></div>
            </div>
        </div>

    </div>

    <!-- Fixed Footer -->
    <div class="fixed bottom-0 left-0 w-full p-3.5 bg-gradient-to-t from-[var(--tg-theme-bg-color)] via-[var(--tg-theme-bg-color)] to-transparent shrink-0 flex gap-2.5">
        <button type="button" onclick="closeWithoutSaving()" class="px-4 py-3.5 rounded-xl font-semibold text-sm bg-gray-800 border border-gray-600 text-gray-200 shrink-0">
            Back
        </button>
        <button id="save-btn" type="button" onclick="saveAndClose()" class="flex-1 btn-pivok py-3.5 rounded-xl font-bold shadow-lg text-sm sm:text-base flex justify-center items-center">
            <span id="lbl-save">Save & Back to Post</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const uidParam = urlParams.get('uid') || '';
        const cidParam = urlParams.get('cid') || '';
        const pmIdParam = urlParams.get('pmid') || '';

        let presets = [];
        let openUrlEditorKeys = {};
        let customRows = [];
        let mediaType = null;
        let currentTab = 'buttons';
        let customSectionOpen = false;
        let sortableRowsInstance = null;
        let sortableButtonsInstances = [];

        function normalizeUrl(u) {
            let s = (u || '').trim();
            if (!s) return '';
            if (s.startsWith('@')) return 'https://t.me/' + s.slice(1);
            if (!/^https?:\/\//i.test(s) && !/^tg:\/\//i.test(s)) return 'https://' + s;
            return s;
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function closeWithoutSaving() {
            tg.close();
        }

        function getMaxChars() {
            return mediaType ? 1024 : 4096;
        }

        function updateCharCounter() {
            const val = document.getElementById('post-text-area').value || '';
            const max = getMaxChars();
            const el = document.getElementById('char-counter');
            el.innerText = `${val.length} / ${max}`;
            el.className = val.length > max
                ? 'text-xs font-mono text-red-400 font-bold'
                : 'text-xs font-mono text-gray-400';
        }

        fetch('/api/get_draft', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                initData: tg.initData,
                uid: uidParam,
                cid: cidParam,
                pmid: pmIdParam
            })
        })
        .then(r => r.json())
        .then(data => {
            if (data.channel) {
                document.getElementById('channel-badge').innerText = data.channel;
            }
            mediaType = data.media_type || null;
            if (mediaType) {
                document.getElementById('text-mode-label').innerText = `Edit ${mediaType} caption (optional):`;
                document.getElementById('preview-media-badge').classList.remove('hidden');
                document.getElementById('preview-media-box').classList.remove('hidden');
            }
            if (typeof data.text === 'string') {
                document.getElementById('post-text-area').value = data.text;
            }
            updateCharCounter();

            presets = Array.isArray(data.presets) ? data.presets : [];
            customRows = Array.isArray(data.custom_rows) ? data.custom_rows : [];
            if (typeof data.auto_sort === 'boolean') {
                document.getElementById('chk-autosort').checked = data.auto_sort;
            }
            if (data.mode === 'pinned' || customRows.length > 0) {
                customSectionOpen = true;
                document.getElementById('custom-section').classList.remove('hidden');
            }
            renderPresets();
            renderCustomEditor();
        })
        .catch(() => {
            presets = [];
            renderPresets();
        });

        function syncPresetInputs() {
            presets.forEach((p, idx) => {
                const urlInput = document.getElementById(`preset-url-${idx}`);
                if (urlInput) {
                    p.url = normalizeUrl(urlInput.value);
                }
            });
        }

        function togglePresetSelected(idx) {
            syncPresetInputs();
            presets[idx].selected = !presets[idx].selected;
            if (presets[idx].selected && !presets[idx].url) {
                openUrlEditorKeys[presets[idx].key] = true;
            }
            renderPresets();
        }

        function togglePresetUrlEdit(idx) {
            syncPresetInputs();
            const k = presets[idx].key;
            openUrlEditorKeys[k] = !openUrlEditorKeys[k];
            renderPresets();
        }

        function selectAllConfigured(enable) {
            syncPresetInputs();
            presets.forEach(p => {
                p.selected = enable ? Boolean(p.url) : false;
            });
            renderPresets();
        }

        function renderPresets() {
            const container = document.getElementById('presets-container');
            container.innerHTML = '';

            presets.forEach((p, idx) => {
                const hasUrl = Boolean((p.url || '').trim());
                const showUrlInput = Boolean(openUrlEditorKeys[p.key]);
                const card = document.createElement('div');
                card.className = `rounded-xl border p-3 transition ${
                    p.selected
                        ? 'bg-gray-800/90 border-[#d6a474]/70 shadow-sm'
                        : 'bg-gray-800/40 border-gray-700 opacity-85'
                }`;

                const badgeHtml = hasUrl
                    ? `<span class="text-[10px] px-2 py-0.5 rounded-full bg-green-900/60 border border-green-700 text-green-300">Ready</span>`
                    : `<span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-900/50 border border-amber-700 text-amber-300">Link not set</span>`;

                card.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <label class="flex items-center gap-3 cursor-pointer select-none flex-1 min-w-0">
                            <input type="checkbox" ${p.selected ? 'checked' : ''} onchange="togglePresetSelected(${idx})" class="w-4 h-4 rounded accent-[#d6a474] shrink-0">
                            <span class="font-semibold text-sm truncate">${escapeHtml(p.text)}</span>
                            ${badgeHtml}
                        </label>
                        <button type="button" onclick="togglePresetUrlEdit(${idx})" class="text-xs px-2.5 py-1 rounded bg-gray-700/60 hover:bg-gray-700 text-gray-200 border border-gray-600 shrink-0">
                            ${showUrlInput ? 'Done' : 'Edit Link'}
                        </button>
                    </div>
                    ${
                        showUrlInput
                            ? `<div class="mt-2.5">
                                   <input id="preset-url-${idx}" type="url" placeholder="Paste https://... link for ${escapeHtml(p.text)}" value="${escapeHtml(p.url || '')}" oninput="presets[${idx}].url = this.value.trim()" class="w-full text-xs rounded-lg px-3 py-2 placeholder-gray-500">
                               </div>`
                            : (hasUrl ? `<div class="mt-1 pl-7 text-[11px] text-gray-400 truncate">${escapeHtml(p.url)}</div>` : '')
                    }
                `;
                container.appendChild(card);
            });
        }

        function toggleCustomSection() {
            saveCustomInputsToData();
            customSectionOpen = !customSectionOpen;
            document.getElementById('custom-section').classList.toggle('hidden', !customSectionOpen);
            document.getElementById('custom-toggle-arrow').innerText = customSectionOpen ? '▴' : '▾';
            if (customSectionOpen) renderCustomEditor();
        }

        function saveCustomInputsToData() {
            const container = document.getElementById('rows-container');
            if (!container) return;
            const rowEls = container.querySelectorAll('.row-block');
            if (rowEls.length === 0 && customRows.length === 0) return;
            if (rowEls.length === 0 && !customSectionOpen) return;

            let updated = [];
            rowEls.forEach(rowEl => {
                let r = [];
                rowEl.querySelectorAll('.btn-block').forEach(btnEl => {
                    const text = btnEl.querySelector('.input-text').value;
                    const url = normalizeUrl(btnEl.querySelector('.input-url').value);
                    const style = btnEl.querySelector('.select-style').value;
                    r.push({ text, url, style: style || null });
                });
                updated.push(r);
            });
            customRows = updated;
        }

        function toggleNewBadge(rIndex, bIndex) {
            saveCustomInputsToData();
            const btn = customRows[rIndex][bIndex];
            if (!btn) return;
            if ((btn.text || '').includes('🆕')) {
                btn.text = btn.text.replace(/🆕\s*/g, '').trim();
                if (btn.style === 'success') btn.style = null;
            } else {
                btn.text = '🆕 ' + (btn.text || '').trim();
                btn.style = 'success';
            }
            renderCustomEditor();
        }

        function renderCustomEditor() {
            const container = document.getElementById('rows-container');
            container.innerHTML = '';

            sortableButtonsInstances.forEach(s => s.destroy());
            sortableButtonsInstances = [];
            if (sortableRowsInstance) sortableRowsInstance.destroy();

            customRows.forEach((row, rIndex) => {
                const rowEl = document.createElement('div');
                rowEl.className = 'row-block bg-gray-800/70 border border-gray-700 rounded-xl overflow-hidden';

                const header = document.createElement('div');
                header.className = 'bg-gray-900/60 p-2 flex justify-between items-center border-b border-gray-700';
                header.innerHTML = `
                    <div class="flex items-center gap-2">
                        <div class="row-handle text-gray-400 hover:text-white px-2 py-0.5 cursor-grab">≡</div>
                        <span class="text-xs font-semibold text-gray-300">Custom Row ${rIndex + 1}</span>
                    </div>
                    <button type="button" onclick="deleteRow(${rIndex})" class="text-red-400 text-xs px-2">Delete Row</button>
                `;
                rowEl.appendChild(header);

                const btnsContainer = document.createElement('div');
                btnsContainer.className = 'btns-container p-2 space-y-2';

                row.forEach((btn, bIndex) => {
                    const isNewActive = (btn.text || '').includes('🆕');
                    const btnEl = document.createElement('div');
                    btnEl.className = 'btn-block flex gap-2 bg-gray-700/40 p-2 rounded-lg border border-gray-600';
                    btnEl.innerHTML = `
                        <div class="btn-handle flex items-center text-gray-400 cursor-grab px-1">≡</div>
                        <div class="flex-1 space-y-1.5 min-w-0">
                            <div class="flex gap-1.5">
                                <input type="text" class="input-text w-full text-xs rounded px-2.5 py-1.5" placeholder="Button Title" value="${escapeHtml(btn.text)}">
                                <button type="button" onclick="toggleNewBadge(${rIndex}, ${bIndex})" class="px-2 py-1 rounded text-xs font-bold shrink-0 border ${isNewActive ? 'bg-green-700 border-green-400 text-white' : 'bg-gray-800 border-gray-600 text-gray-400'}">🆕</button>
                            </div>
                            <div class="flex gap-1.5">
                                <input type="text" class="input-url w-full text-xs rounded px-2.5 py-1.5" placeholder="https://..." value="${escapeHtml(btn.url)}">
                                <select class="select-style w-24 text-xs rounded px-1 py-1.5 shrink-0">
                                    <option value="" ${!btn.style ? 'selected' : ''}>Default</option>
                                    <option value="primary" ${btn.style === 'primary' ? 'selected' : ''}>Blue</option>
                                    <option value="success" ${btn.style === 'success' ? 'selected' : ''}>Green</option>
                                    <option value="danger" ${btn.style === 'danger' ? 'selected' : ''}>Red</option>
                                </select>
                            </div>
                        </div>
                        <button type="button" onclick="deleteButton(${rIndex}, ${bIndex})" class="text-gray-400 hover:text-red-400 px-1 text-sm self-start">✕</button>
                    `;
                    btnsContainer.appendChild(btnEl);
                });

                rowEl.appendChild(btnsContainer);

                const addWrap = document.createElement('div');
                addWrap.className = 'p-2 pt-0';
                addWrap.innerHTML = `<button type="button" onclick="addNewButton(${rIndex})" class="w-full py-1.5 bg-gray-700/40 rounded border border-gray-600 text-xs text-gray-200">+ Add Button in Row</button>`;
                rowEl.appendChild(addWrap);

                container.appendChild(rowEl);

                sortableButtonsInstances.push(
                    new Sortable(btnsContainer, {
                        group: 'custom-buttons',
                        handle: '.btn-handle',
                        animation: 150,
                        ghostClass: 'sortable-ghost',
                        onEnd: () => { saveCustomInputsToData(); renderCustomEditor(); }
                    })
                );
            });

            sortableRowsInstance = new Sortable(container, {
                handle: '.row-handle',
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: () => { saveCustomInputsToData(); renderCustomEditor(); }
            });
        }

        function addNewRow() {
            saveCustomInputsToData();
            customRows.push([{ text: '', url: '', style: null }]);
            renderCustomEditor();
        }

        function addNewButton(rIndex) {
            saveCustomInputsToData();
            customRows[rIndex].push({ text: '', url: '', style: null });
            renderCustomEditor();
        }

        function deleteRow(rIndex) {
            saveCustomInputsToData();
            customRows.splice(rIndex, 1);
            renderCustomEditor();
        }

        function deleteButton(rIndex, bIndex) {
            saveCustomInputsToData();
            customRows[rIndex].splice(bIndex, 1);
            if (customRows[rIndex].length === 0) customRows.splice(rIndex, 1);
            renderCustomEditor();
        }

        function sortCustomRows() {
            let flat = [];
            customRows.forEach(r => flat.push(...r.filter(b => (b.text || '').trim() !== '')));
            if (flat.length === 0) return;
            const clean = t => t.replace(/🆕/g, '').trim().toLowerCase();
            flat.sort((a, b) => clean(a.text).localeCompare(clean(b.text)));
            customRows = [];
            for (let i = 0; i < flat.length; i += 2) {
                customRows.push(flat.slice(i, i + 2));
            }
        }

        function buildCombinedPreviewRows() {
            syncPresetInputs();
            saveCustomInputsToData();

            const activePresets = presets.filter(p => p.selected && (p.url || '').trim() !== '');
            const combined = [];
            for (let i = 0; i < activePresets.length; i += 2) {
                combined.push(activePresets.slice(i, i + 2));
            }
            customRows.forEach(r => {
                const valid = r.filter(b => (b.text || '').trim() !== '' && (b.url || '').trim() !== '');
                if (valid.length > 0) combined.push(valid);
            });
            return combined;
        }

        function renderPreview() {
            const txt = document.getElementById('post-text-area').value || '';
            const textBox = document.getElementById('preview-text-box');
            textBox.innerText = txt;
            textBox.classList.toggle('hidden', !txt.trim());

            const container = document.getElementById('preview-container');
            container.innerHTML = '';
            const allRows = buildCombinedPreviewRows();

            if (allRows.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 py-2 text-xs italic">No buttons selected for this post</p>`;
                return;
            }

            allRows.forEach(row => {
                const rowEl = document.createElement('div');
                rowEl.className = 'flex gap-1.5 w-full';
                row.forEach(btn => {
                    const btnEl = document.createElement('div');
                    let bgClass = 'tg-bg-default';
                    if (btn.style === 'primary') bgClass = 'tg-bg-primary';
                    if (btn.style === 'success') bgClass = 'tg-bg-success';
                    if (btn.style === 'danger') bgClass = 'tg-bg-danger';
                    btnEl.className = `flex-1 flex justify-center items-center px-2 py-2.5 rounded-lg text-xs font-semibold ${bgClass} truncate relative`;
                    btnEl.innerHTML = `<span class="truncate block w-full text-center pr-3">${escapeHtml(btn.text)}</span><span class="opacity-70 text-[10px] absolute right-1.5 top-1">↗</span>`;
                    rowEl.appendChild(btnEl);
                });
                container.appendChild(rowEl);
            });
        }

        function switchTab(tab) {
            syncPresetInputs();
            saveCustomInputsToData();
            currentTab = tab;

            const map = {
                buttons: ['tab-buttons', 'view-buttons'],
                text: ['tab-text', 'view-text'],
                preview: ['tab-preview', 'view-preview']
            };

            Object.keys(map).forEach(k => {
                const [tId, vId] = map[k];
                document.getElementById(tId).className = `flex-1 py-3 text-center transition text-xs sm:text-sm ${k === tab ? 'tab-active' : 'tab-inactive'}`;
                document.getElementById(vId).classList.toggle('hidden', k !== tab);
            });

            if (tab === 'buttons') {
                renderPresets();
                if (customSectionOpen) renderCustomEditor();
            } else if (tab === 'preview') {
                if (document.getElementById('chk-autosort').checked) sortCustomRows();
                renderPreview();
            }
        }

        function saveAndClose() {
            syncPresetInputs();
            saveCustomInputsToData();

            const autoSort = document.getElementById('chk-autosort').checked;
            if (autoSort) sortCustomRows();

            // Check selected presets without URL
            const missingPresets = presets.filter(p => p.selected && !(p.url || '').trim());
            if (missingPresets.length > 0) {
                missingPresets.forEach(p => { openUrlEditorKeys[p.key] = true; });
                switchTab('buttons');
                tg.showAlert(`Link is not configured yet for: ${missingPresets.map(p => p.text).join(', ')}. Please paste its link or uncheck it.`);
                return;
            }

            // Check custom buttons with missing URL
            let missingCustomUrl = false;
            customRows.forEach(r => r.forEach(b => {
                if ((b.text || '').trim() !== '' && !(b.url || '').trim()) missingCustomUrl = true;
            }));
            if (missingCustomUrl) {
                tg.showAlert('One of your custom buttons has a title without a URL. Please enter its URL or remove it.');
                return;
            }

            const postText = document.getElementById('post-text-area').value || '';
            const maxChars = getMaxChars();
            if (postText.length > maxChars) {
                switchTab('text');
                tg.showAlert(`Text exceeds maximum length (${postText.length} / ${maxChars} characters).`);
                return;
            }
            if (!mediaType && !postText.trim()) {
                switchTab('text');
                tg.showAlert('Post text cannot be empty.');
                return;
            }

            const presetUrls = {};
            presets.forEach(p => {
                presetUrls[p.key] = normalizeUrl(p.url || '');
            });
            const selectedKeys = presets.filter(p => p.selected).map(p => p.key);
            const cleanCustomRows = customRows
                .map(r => r.filter(b => (b.text || '').trim() !== '' && (b.url || '').trim() !== ''))
                .filter(r => r.length > 0);

            document.getElementById('save-btn').disabled = true;
            document.getElementById('lbl-save').innerText = 'Saving...';

            fetch('/api/save_draft', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    initData: tg.initData,
                    uid: uidParam,
                    cid: cidParam,
                    pmid: pmIdParam,
                    selected_keys: selectedKeys,
                    preset_urls: presetUrls,
                    custom_rows: cleanCustomRows,
                    text: postText,
                    auto_sort: autoSort
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    tg.close();
                } else {
                    tg.showAlert(data.error || 'Failed to save changes.');
                    document.getElementById('save-btn').disabled = false;
                    document.getElementById('lbl-save').innerText = 'Save & Back to Post';
                }
            })
            .catch(() => {
                tg.showAlert('Network error while saving changes.');
                document.getElementById('save-btn').disabled = false;
                document.getElementById('lbl-save').innerText = 'Save & Back to Post';
            });
        }
    </script>
</body>
</html>
